# UNVERIFIED PLACEHOLDER DATA — see fixtures/README.md.
#
# FixtureRetrievalPort (adapters/fixture/fixture_retrieval_port.py) serves
# these as canned contracts.RetrievalResult objects, keyed by exact,
# case-insensitive match on `query`. A query not listed here raises
# UnknownMockQueryError rather than silently returning an empty result —
# an empty candidate list would be indistinguishable from a genuine
# "nothing matched" outcome, which this fixture is not trying to assert.

