# UNVERIFIED PLACEHOLDER DATA — see fixtures/README.md.
#
# Unlike street_lighting/ (deliberately dense, with a hub and a cycle) and
# reinforcement_steel/ (a clean, moderately connected second topology),
# this domain deliberately mirrors what integration Stage C actually
# measured in Teammate 1's real corpus: ~0.6 edges/node, most nodes with
# zero outgoing edges, several small disconnected components, one fully
# isolated node, and one relationship type with no schema_map mapping
# (testing the fallback bucket in a realistic-shaped context, not just an
# ad-hoc synthetic one — see tests/test_fixture_adapters.py for that).
# IS numbers here are placeholder (IS 5xxx), not drawn from a real family,
# specifically so this fixture is never mistaken for real corpus content —
# it exists to mirror shape, not substance.

